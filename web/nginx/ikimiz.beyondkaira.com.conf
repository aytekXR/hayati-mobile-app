# nginx vhost for ikimiz.beyondkaira.com
#
# DERIVED FROM firebase.json, NOT WRITTEN FROM MEMORY. Every directive below
# exists because Firebase Hosting does something the app or Apple depends on,
# and nginx does not do it by default. Losing any one of them breaks something
# that fails QUIETLY:
#
#   cleanUrls        -> try_files ... $uri/index.html
#                       Without it /support is a 404 and only /support/ works.
#   rewrite /i/**    -> location ^~ /i/
#                       Every invite link ever shared resolves through this.
#   AASA content-type-> application/json on the well-known file.
#                       Apple FETCHES this over TLS and IGNORES a file served as
#                       anything else. It fails silently: no error, universal
#                       links simply never activate. (The entitlement is absent
#                       today by ADR-040, so this is dormant — but it must be
#                       right before it is re-added, and a dormant bug is the
#                       hardest kind to notice.)
#   security headers -> add_header, with `always` so they survive 404s too.
#
# HSTS NOTE: beyondkaira.com already sends
# `Strict-Transport-Security: max-age=31536000; includeSubDomains`, which is why
# a browser refuses the click-through on a bad cert for this subdomain. That is
# HSTS working correctly. It also means this vhost MUST have a valid
# certificate before it is useful — there is no degraded HTTP mode available.

server {
    listen 80;
    listen [::]:80;
    server_name ikimiz.beyondkaira.com;

    # certbot writes its challenge here; everything else goes to TLS. Placed
    # BEFORE the redirect on purpose — a blanket 301 makes HTTP-01 renewal fail
    # a year from now, long after anyone remembers why.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ikimiz.beyondkaira.com;

    # certbot fills these in; see the runbook beside this file.
    ssl_certificate     /etc/letsencrypt/live/beyondkaira.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beyondkaira.com/privkey.pem;

    root /var/www/ikimiz;
    index index.html;

    # `always` matters: without it these are dropped on 4xx/5xx responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # `charset_types` is deliberately NOT widened to application/json. Adding it
    # makes nginx append `; charset=utf-8` to the app-site-association response,
    # and Firebase serves that file as bare `application/json` (measured S056).
    # Apple is the consumer and its tolerance for the parameter is not something
    # this repo has tested, so match the thing that is known to work.
    charset utf-8;

    # Apple's app-site-association. Extensionless, so nginx would otherwise
    # serve it as application/octet-stream and Apple would ignore it.
    # `^~` so no regex location can ever take precedence over this.
    #
    # `default_type` ONLY — an `add_header Content-Type` here as well emits the
    # header TWICE (verified by running this config: the response carried both
    # `application/json; charset=utf-8` and `application/json`). A duplicated
    # Content-Type is malformed, and this is the one file whose whole purpose is
    # its content type.
    location ^~ /.well-known/apple-app-site-association {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # firebase.json: { "source": "/i/**", "destination": "/invite.html" }
    # The invite page reads the code from the PATH, so the original URI must be
    # preserved rather than redirected — a 301 to /invite.html would drop the
    # code and hand the invitee an empty page.
    location ^~ /i/ {
        try_files /invite.html =404;
    }

    # firebase.json: cleanUrls true, trailingSlash false.
    #
    # The final fallback is `=404`, NOT `/404.html`. Falling back to the file
    # directly serves the not-found page with status **200** — verified by
    # running this config, where a missing path returned `HTTP/1.1 200 OK` with
    # the 404 body. That is the classic nginx soft-404: every missing page then
    # claims to exist, to crawlers and to anything else reading the status line.
    # `=404` + `error_page` gives the right status AND the right body.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
