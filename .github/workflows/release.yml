# release — tag-triggered iOS build / sign / TestFlight lane (ADR-021,
# docs/architecture.md §9). ci.yml (quality + iOS build smoke) is the per-PR merge
# gate; this is the release path. The pre-signing stages (preflight / integration /
# build-report) are proven green; the sign-upload boundary FAILS CLOSED — loudly, at
# a named step — unless all FIVE release secrets exist: ASC_KEY_ID / ASC_ISSUER_ID
# (`release` environment) and ASC_API_KEY_P8_BASE64 / MATCH_GIT_URL / MATCH_PASSWORD
# (repository). A dispatch without them is EXPECTED to end red at that boundary; that
# red is the honest state of the lane, proven not asserted (never a silent skip that
# looks green). Signing is fastlane `match` + MANUAL since ADR-032 — NOT ADR-021 D5's
# API-key cloud signing, which cannot work on a hosted runner.
name: release

on:
  # Release path: a vX.Y.Z tag push (agent-workflows.md W7). workflow_dispatch
  # proves the lane end-to-the-boundary without cutting a tag — but GitHub only
  # registers workflow_dispatch once the file lives on the default branch, so a
  # first-time release.yml cannot be dispatched from its own feature branch; the
  # acceptance dispatch runs post-merge as `gh workflow run release.yml --ref main`
  # (ADR-021 D1 rev 2). Later edits, with the workflow already on main, can use
  # branch dispatches like ci.yml.
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Serialize releases on the ref, but NEVER cancel an in-flight one: a half-cancelled
# TestFlight upload or metadata deliver is worse than a queued run (ADR-021 D2).
# Contrast ci.yml, which cancels superseded PR runs to save billed minutes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege token: every job only checks out and builds. Signing/upload
# credentials come from environment secrets (job `sign-upload`), never the token.
permissions:
  contents: read

env:
  # Single pin, shared with ci.yml (past-prompts.md Session 001).
  FLUTTER_VERSION: "3.44.5"

jobs:
  preflight:
    name: preflight
    # Cheap ubuntu gate, fails fast before the slow macOS legs: store metadata
    # must lint clean and, on a tag run, the tag must agree with pubspec.
    # (Was "before any 10x-billed macOS minute" — the repo is PUBLIC, so
    # GitHub-hosted runners are free. Corrected S041, ADR-029 D6. It is NOT
    # about queueing either: macOS queue time here is ~6 seconds, measured over
    # 24 jobs at S049. It stands on RUN DURATION and signal ordering — the macOS
    # legs take 6 and ~22 minutes, so a lint error should surface in seconds
    # rather than half an hour later. Issue #100, closed on that measurement.)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Same repo-local, credential-free lint ci.yml's quality job runs (ADR-020
      # D6): Apple char limits + required files per locale. --allow-empty-urls is
      # the ratchet flag — the empty privacy/support URL files warn+count instead
      # of hard-failing until the founder supplies a domain (ADR-020 D5).
      - name: store metadata lint
        run: dart tool/store_metadata_lint.dart tr en-US
      # ADR-032: the release lane's own internal agreement — the fail-closed
      # gate covers the secrets the job consumes, each fastlane step is fed what
      # its lane requires, the build name still comes from pubspec, and
      # name.txt still matches the live App Store listing. Cheap, credential-free
      # and deliberately HERE: every defect it checks for shipped green for four
      # days because nothing looked at the lane as a whole, and catching it on
      # ubuntu costs seconds instead of a 30-minute macOS round trip.
      - name: release lane lint
        run: dart tool/release_lane_lint.dart
      - name: tag ↔ pubspec version consistency
        # One step with NO step-level if: — it always runs, so a dispatch shows an
        # honest "checked: tag-only" line rather than a skipped step that reads
        # grey-green (W4). On a vX.Y.Z tag it hard-fails when the tag's X.Y.Z
        # disagrees with app/pubspec.yaml's version X.Y.Z: one source of truth
        # (ADR-021 D3).
        #
        # SCOPE, corrected S047 (ADR-032 D3): this checks the version NAME only.
        # The build NUMBER after the `+` is NOT pubspec's any more — the Fastfile
        # synthesizes `100 + GITHUB_RUN_NUMBER`, and the highest build already
        # uploaded for 0.1.0 is 109 while pubspec still reads +4. This comment
        # used to claim the build number "is never synthesized in CI", which was
        # true when it was written and false the moment PR #117 merged.
        #
        # The name half is only a real guarantee while the Fastfile passes no
        # `--build-name` (it once hardcoded 0.1.0, which made this step guard a
        # string the build ignored). `tool/release_lane_lint.dart` pins that.
        run: |
          pubspec_version="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' app/pubspec.yaml)"
          if [ -z "$pubspec_version" ]; then
            echo "Could not read an X.Y.Z version from app/pubspec.yaml." >&2
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/*)
              tag="${GITHUB_REF#refs/tags/}"
              tag_version="${tag#v}"
              if [ "$tag_version" != "$pubspec_version" ]; then
                echo "Tag/pubspec version mismatch (ADR-021 D3):" >&2
                echo "  tag:     $tag  (X.Y.Z = $tag_version)" >&2
                echo "  pubspec: $pubspec_version" >&2
                echo "Retag or bump app/pubspec.yaml so they agree." >&2
                exit 1
              fi
              echo "tag $tag matches app/pubspec.yaml version $pubspec_version."
              ;;
            *)
              echo "Not a tag ref ($GITHUB_REF); version consistency is checked tag-only (ADR-021 D3). pubspec version is $pubspec_version."
              ;;
          esac

  integration:
    name: integration
    # The strongest release signal that exists today: the integration_test/ suites
    # against the auth/firestore/functions emulators, reusing ci.yml's
    # integration-emulator recipe (same Xcode 16.4 pin, fresh-sim lowest-runtime
    # boot, serialized suites, issue-#15 quarantine) with NO code_changed gate —
    # a release always runs it. The promised E2E simulator matrix (current-1/current
    # with E2E-1/2/3) does NOT exist and is NOT faked: E2E-2 (sandbox purchase)
    # needs operator items 0+4. That deferral is recorded in docs/test-suite.md;
    # the matrix enters when the scenarios can honestly run (ADR-021 D2).
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # firestore emulator needs Java 21+. macos-15 already defaults to Temurin
      # 21; pin it so a future image default-bump can't silently regress the
      # emulator (the JDK is cached on the image, so this step is ~5-10s).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # M2.2: the functions emulator serves the createInvite callable this
      # suite exercises. Node 22 matches functions/package.json engines
      # (bumped from 20 in S043/ADR-030 — nodejs20 is DECOMMISSIONED 2026-10-30).
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: npm ci (functions)
        working-directory: functions
        run: npm ci
      # The functions emulator never compiles TS — it require()s package.json
      # "main" (lib/index.js), so the build must land before emulators:exec.
      - name: build functions
        working-directory: functions
        run: npm run build
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: install firebase-tools (pinned to dev-box version)
        run: npm install -g firebase-tools@15.22.4
      # Cache the firestore emulator JAR (~138 MB, the only large download; the
      # auth emulator ships inside firebase-tools). Same key as ci.yml so the two
      # workflows share the cache; a pin bump re-fetches, a miss just re-downloads.
      - name: Cache Firebase emulator jars
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-macos-fbtools-15.22.4
      - name: Pre-fetch firestore emulator jar
        run: firebase setup:emulators:firestore
      # Deterministic sim boot: pin Xcode 16.4, create a FRESH device on the
      # lowest available iOS runtime (18.x pairs with 16.4; the image's 26.x
      # runtimes need Xcode 26), and block until booted (no sleep). Explicit
      # -d $DEVICE_ID is required — the runner exposes macOS-desktop + the sim,
      # so flutter test cannot auto-pick.
      - name: Boot iOS simulator
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          RUNTIME=$(xcrun simctl list runtimes ios --json | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x.get('isAvailable')]; r.sort(key=lambda x:[int(n) for n in x['version'].split('.')]); print(r[0]['identifier'])")
          echo "runtime=$RUNTIME"
          DEVICE_ID=$(xcrun simctl create hayati-ci 'iPhone 16' "$RUNTIME")
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      # emulators:exec starts auth+firestore+functions, WAITS for readiness, runs
      # the script, tears the emulators down, and propagates the exit code — one
      # deterministic pass/fail, no orphans (W4: no silent retries, no `|| true`).
      # demo-hayati is credential-free (no secrets). Runs from repo root
      # (firebase.json lives here). --timeout none keeps the long first-run sim
      # compile from tripping the per-test timeout (the job timeout is the real
      # bound); -r expanded streams progress so a wedge shows. One `flutter test`
      # invocation PER SUITE, sequentially: passing the whole integration_test/
      # directory lets flutter_tools run suites concurrently against the one
      # simulator, where they fight over the shared com.hayati.app bundle.
      # DEVICE_ID reaches the inner shell through GITHUB_ENV. phone_auth_emulator_test
      # is QUARANTINED, not silently dropped: it crashes the app process natively
      # inside verifyPhoneNumber on the simulator (issue #15). The ::warning:: keeps
      # it visible every run so it cannot rot (W4). The phone flow stays covered by
      # VM unit tests with fakes.
      - name: Integration tests (auth + firestore + functions emulators)
        run: |
          firebase emulators:exec --only auth,firestore,functions --project demo-hayati \
            'cd app && for suite in integration_test/*_test.dart; do
               case "$suite" in
                 */phone_auth_emulator_test.dart)
                   echo "::warning file=app/$suite::Quarantined from CI — crashes the app natively in verifyPhoneNumber on the iOS simulator (issue #15). Covered by VM unit tests."
                   continue;;
               esac
               echo "::group::$suite"
               flutter test "$suite" \
                 --dart-define=USE_AUTH_EMULATOR=true \
                 --dart-define=USE_FIRESTORE_EMULATOR=true \
                 --dart-define=USE_FUNCTIONS_EMULATOR=true \
                 -d "$DEVICE_ID" -r expanded --timeout none || exit 1
               echo "::endgroup::"
             done'

  build-report:
    name: build-report
    # Parallel with integration (it needs no emulators): a real prod-flavor release
    # build with size analysis. Prod entrypoint deliberately — TestFlight builds
    # carry prod config, so the size that matters is prod's (ADR-021 D2). The size
    # gate is an exact, stable number with a generous 200 MB pathology cap (ADR-022
    # D4); a missing/unparseable analysis is a hard fail, never a green "couldn't
    # measure".
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: build ios (release, no codesign) + analyze size
        working-directory: app
        # --analyze-size writes the raw snapshot.<arch>.json / trace.<arch>.json
        # intermediates into --code-size-directory, but the full-bundle treemap
        # (the number the cap cares about) lands in $HOME/.flutter-devtools
        # (verified against flutter_tools build_ios.dart). Stage that treemap next
        # to the intermediates so the gate + artifact use one stable path; a
        # missing file fails the step (no `|| true`) — a build that didn't analyze
        # must not slip through green (W4 / ADR-022 D4). du -sh is the independent
        # whole-.app cross-check, printed even if the gate later fails.
        run: |
          flutter build ios --release --no-codesign -t lib/main_prod.dart \
            --analyze-size --code-size-directory=build/size-analysis
          cp "$HOME/.flutter-devtools/"ios-code-size-analysis_*.json \
            build/size-analysis/ios-code-size-analysis.json
          du -sh build/ios/iphoneos/Runner.app
      - name: build size budget (<= 200 MB uncompressed .app)
        run: dart tool/build_size_report.dart --max-mb 200 app/build/size-analysis
      - name: upload size analysis JSON
        uses: actions/upload-artifact@v6
        with:
          name: ios-size-analysis
          path: app/build/size-analysis/ios-code-size-analysis.json
          if-no-files-found: error
          retention-days: 30

  sign-upload:
    name: sign-upload
    # THE boundary job. `environment: release` is load-bearing, not decorative:
    # architecture.md §9 designates GitHub *environment* secrets, and GitHub only
    # exposes environment secrets to a job that declares the binding. Without it
    # `secrets.ASC_*` would silently resolve against repository secrets and read
    # empty even after the founder configures the environment — a configured lane
    # stuck permanently boundary-red with a misleading "missing secrets" message
    # (ADR-021 D4 rev 2, REL-2). Referencing a not-yet-existing environment is safe
    # (GitHub auto-creates it; with no secrets the gate fails closed as designed).
    needs: [preflight, integration, build-report]
    runs-on: macos-26          # Apple requires the iOS 26 SDK (Xcode 26) for App Store uploads
    timeout-minutes: 45
    environment: release
    steps:
      - name: signing secrets gate
        # FIRST step, and an ordinary (non-if:) step BY DESIGN: a step skipped by an
        # `if:` renders grey-green in the Actions UI — exactly the silent-green a
        # release lane must never show (ADR-021 D4). This step FAILS; everything
        # after it simply never runs. It reports the FULL missing set at once (a
        # partial secret set must not reach fastlane to die on an opaque auth error)
        # and never echoes a secret VALUE, only names.
        #
        # The set below is the set this JOB consumes, and keeping the two in step is
        # the whole guarantee (ADR-032 D4). It drifted once: PR #117 moved the lane
        # to fastlane match and added ASC_API_KEY_P8_BASE64 / MATCH_GIT_URL /
        # MATCH_PASSWORD to the job without adding them here, so a missing
        # MATCH_PASSWORD passed this gate and died inside fastlane minutes later —
        # precisely what D4 exists to prevent. `tool/release_lane_lint.dart` now
        # fails the cheap ubuntu preflight if the two sets diverge again.
        #
        # Note the two scopes, both resolvable here: ASC_KEY_ID / ASC_ISSUER_ID are
        # `release` ENVIRONMENT secrets, while ASC_API_KEY_P8_BASE64 / MATCH_* are
        # REPOSITORY secrets — a job with an `environment:` binding sees repository
        # secrets too, with same-named environment secrets winning. The raw
        # `ASC_API_KEY_P8` environment secret is no longer read by anything (ADR-032 D4
        # decodes the base64 one instead, so a single secret holds the key); it can
        # be deleted at the founder's convenience, and nothing breaks if it is not.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          missing=()
          [ -n "$ASC_KEY_ID" ] || missing+=("ASC_KEY_ID")
          [ -n "$ASC_ISSUER_ID" ] || missing+=("ASC_ISSUER_ID")
          [ -n "$ASC_API_KEY_P8_BASE64" ] || missing+=("ASC_API_KEY_P8_BASE64")
          [ -n "$MATCH_GIT_URL" ] || missing+=("MATCH_GIT_URL")
          [ -n "$MATCH_PASSWORD" ] || missing+=("MATCH_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Signing is fail-closed — missing release secret(s): ${missing[*]}"
            {
              echo "======================================================================"
              echo "  SIGNING IS FAIL-CLOSED. Missing secret(s):"
              for name in "${missing[@]}"; do echo "    - $name"; done
              echo ""
              echo "  This lane needs BOTH halves (ADR-032):"
              echo ""
              echo "    App Store Connect API key -> Settings > Environments > release"
              echo "      ASC_KEY_ID, ASC_ISSUER_ID"
              echo "      (copy-paste from one App Store Connect >"
              echo "       Users and Access > Integrations > Keys page)"
              echo ""
              echo "    fastlane match + the base64 key -> repository secrets"
              echo "      ASC_API_KEY_P8_BASE64  (base64 of the same .p8)"
              echo "      MATCH_GIT_URL          (the encrypted certs repo)"
              echo "      MATCH_PASSWORD         (decrypts it)"
              echo ""
              echo "  Without match, a hosted runner has no distribution certificate"
              echo "  and the archive fails 'No valid code signing certificates were"
              echo "  found'. How-to: fastlane/README.md and docs/adr/032-*.md."
              echo ""
              echo "  This red is the honest state of the release lane, not a lane bug."
              echo "======================================================================"
            } >&2
            exit 1
          fi
          echo "All five release signing secrets are present."
      - name: write App Store Connect API key
        # Post-gate only, NO if: (a skipped signing step reads grey-green, ADR-021
        # D4). The .p8 reaches disk here from a secret, never committed, at
        # xcodebuild's documented auto-discovery path
        # ~/.appstoreconnect/private_keys/AuthKey_<KEY_ID>.p8. umask 077 +
        # chmod 600 — key hygiene.
        #
        # WHY THIS STEP STILL EXISTS (ADR-032 D4). It was written for ADR-021 D5's
        # cloud signing, where xcodebuild auto-discovered this file to mint a
        # profile. Under fastlane match + MANUAL signing nothing appears to read
        # it: fastlane gets the key from `ASC_API_KEY_P8_BASE64` via
        # `app_store_connect_api_key(key_content:)`, and an explicit
        # ExportOptions.plist names the profile, so `-allowProvisioningUpdates`
        # (which `flutter build ipa` always passes) has nothing to resolve.
        #
        # It is kept anyway on this repo's own precedent: ADR-029 D2 refused to
        # touch `CODE_SIGN_IDENTITY` because that would be "a blind edit to a
        # signing path from a Linux box with no Mac". The lane demonstrably works
        # WITH this step; "very likely dead" is not "proven dead", and the cost of
        # being wrong is a broken release the founder cannot debug. A session that
        # can watch a real run should delete it and confirm.
        #
        # What DID change: the file is now decoded from ASC_API_KEY_P8_BASE64 —
        # the same secret fastlane authenticates with — instead of requiring a
        # second, separately-maintained raw `ASC_API_KEY_P8`. Two secrets holding
        # one key is a rotation footgun: update one, forget the other, and the
        # lane fails closed on a credential that is not actually wrong.
        #
        # THE `tr` IS LOAD-BEARING, and it is the reason this edit is safe to
        # make from a box that cannot run the lane. `openssl base64 -d -A`
        # silently emits GARBAGE and still exits 0 when its input carries
        # newlines (verified locally against a real PKCS#8 EC key). We do not
        # know how this secret was pasted: fastlane consumes the same value
        # through Ruby's Base64.decode64, which IGNORES newlines, so a wrapped
        # secret works there and would have broken only here. Stripping all
        # whitespace first decodes both forms identically.
        #
        # An App Store Connect key is PKCS#8, so its PEM header is
        # `-----BEGIN PRIVATE KEY-----` (NOT `BEGIN EC PRIVATE KEY`, which is
        # SEC1) — confirmed against a locally generated P-256 key.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" \
            | tr -d '[:space:]' \
            | openssl base64 -d -A > "$key_path"
          chmod 600 "$key_path"
          # Fail loudly if the secret did not decode to a PEM key. A zero-byte or
          # garbage file would otherwise be a silent no-op — and the whole reason
          # this step survives is that we are NOT certain nothing reads it.
          head -1 "$key_path" | grep -q 'BEGIN PRIVATE KEY' || {
            echo "::error::ASC_API_KEY_P8_BASE64 did not decode to a PKCS#8 PEM private key."
            echo "::error::Expected a first line of '-----BEGIN PRIVATE KEY-----'."
            exit 1
          }
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: bundle install
        # Gemfile pins fastlane ~> 2.225 (repo root). Gemfile.lock is documented
        # debt (fastlane/README.md, ADR-021 D6): no Ruby on the dev box means no
        # faithful lock until the first real lane run, so bundler resolves fresh
        # here and there is no lock to key a bundler-cache on.
        run: bundle install
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: select Xcode 26 (Apple rejects uploads built with an older SDK)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
      # Pins the interpreter the Friends-assignment step below installs into and
      # runs from. Without it this job had NO managed python, so bare `pip` and
      # `python3` were different interpreters and the assignment step could never
      # import PyJWT (S056 — it failed on its first ever run, silently, behind
      # continue-on-error). Same version and same shape as
      # testflight-testers.yml, which is the lane that demonstrably works.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fastlane beta (match sign + TestFlight)
        # match installs the Apple Distribution cert + App Store profile from the
        # encrypted MATCH_GIT_URL into the CI keychain, then the Flutter build signs
        # MANUALLY against them — GitHub-hosted runners have no Xcode Apple ID for
        # automatic cloud signing, which fails "No valid code signing certificates
        # were found" (Session 039; mirrors the sibling Unhooked app). FIRST run:
        # repo Variable MATCH_BOOTSTRAP=true so match mints+pushes, then delete it.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_BOOTSTRAP: ${{ vars.MATCH_BOOTSTRAP }}
          # Publishable RevenueCat iOS SDK key (repo variable, ships in the binary).
          REVENUECAT_IOS_API_KEY: ${{ vars.REVENUECAT_IOS_API_KEY }}
        run: bundle exec fastlane ios beta
      - name: assign the new build to the Friends group
        # ADR-037. The founder asked that every new build reach the external
        # "Friends" group automatically, so this runs on every release rather
        # than by dispatch — the deliberate exception to the rule that a merge
        # must never email a real person, because here that IS the request.
        #
        # NOT `pilot(distribute_external: true)`: that needs
        # skip_waiting_for_build_processing to be false, which parks the macOS
        # job in Apple's processing queue for the whole wait. The upload stays
        # fast and the assignment waits separately, here, on cheap ubuntu.
        #
        # NON-BLOCKING on purpose (continue-on-error): the binary already
        # shipped in the step above, and Apple's processing queue is a third
        # party's schedule. Reddening a release because a queue was slow is the
        # cries-wolf mistake ADR-034 rejected; the tool prints how to re-run.
        #
        # ⚠️ The cost of that non-blocking choice was measured at S056: this step
        # failed on its FIRST EVER execution (release run 30502948416, build 112)
        # and the release still reported success. `continue-on-error` is still
        # right — Apple's queue is a third party's schedule — but "non-blocking"
        # must not mean "unread". Whoever dispatches a release reads THIS step's
        # log, or confirms with `-f status_only=true`, before believing a build
        # reached anybody.
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          # ADR-038 D4: a release is already an intentional act, and a build
          # that ships and then sits blocked on a form nobody filled is the
          # whole failure this lane exists to prevent. Idempotent — a run where
          # all four already match writes nothing and says "unchanged".
          # It does NOT submit for Beta App Review: that puts the app in front
          # of an Apple reviewer, which stays a deliberate dispatch (D3).
          ASC_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_FIRST_NAME }}
          ASC_REVIEW_CONTACT_LAST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_LAST_NAME }}
          ASC_REVIEW_CONTACT_EMAIL: ${{ secrets.ASC_REVIEW_CONTACT_EMAIL }}
          ASC_REVIEW_CONTACT_PHONE: ${{ secrets.ASC_REVIEW_CONTACT_PHONE }}
        run: |
          # `python3 -m pip`, NOT bare `pip` — and this is the whole reason this
          # step has never once worked (S056). On macos-15 there is no
          # actions/setup-python in this job, so bare `pip` resolves to a
          # DIFFERENT interpreter than `python3`: the install reported success,
          # printed a pip-upgrade notice, and then `python3` raised
          # `ModuleNotFoundError: No module named 'jwt'`. Because the step is
          # continue-on-error, the release went green while ADR-037's central
          # guarantee — every build reaches Friends automatically — silently did
          # not happen. Routing pip through the same interpreter that runs the
          # script makes them the same by CONSTRUCTION rather than by PATH order.
          # The setup-python step above is what keeps that interpreter free of
          # PEP-668 "externally managed" refusals, exactly as
          # testflight-testers.yml does it.
          python3 -m pip install --quiet 'pyjwt[crypto]==2.10.1'
          # Prove the import before spending 25 minutes on Apple's queue: a
          # missing module must fail HERE, loudly, and not as a silent no-op
          # inside a continue-on-error step.
          python3 -c "import jwt, cryptography; print('pyjwt', jwt.__version__, 'ok')"
          # The same synthesized number the build carries (ADR-032 D3).
          # --set-review-contact is passed unconditionally; if the four secrets
          # are unset the tool fails closed naming them, and this step is
          # continue-on-error, so the release still reports the binary it shipped.
          python3 tool/ci/testflight_testers.py \
            --bundle-id com.beyondkaira.hayati \
            --group Friends \
            --set-review-contact \
            --assign-build-number "$((100 + GITHUB_RUN_NUMBER))" \
            --wait-minutes 25
      - name: fastlane store_metadata (deliver per locale)
        # Pushes fastlane/metadata TR/EN via deliver(skip_binary_upload). NON-BLOCKING
        # (continue-on-error): store copy is native-review-gated (ADR-020 D8) and must
        # never fail the run — the TestFlight binary already shipped in the step above.
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: bundle exec fastlane ios store_metadata

  slack-notify:
    name: slack-notify
    # ADR-024, same shape and same script as ci.yml's terminal job (D1: one
    # tested source, not four drifting copies — the reference repo already has
    # two copies reporting the NOTIFIER's own job name instead of what broke).
    #
    # Deliberately NO `environment: release` (ADR-024 D4). `sign-upload` binds it
    # for the ASC_* secrets, but this job must post on failures from ANY job —
    # including a `sign-upload` that fail-closed BECAUSE that environment has no
    # secrets yet. Binding the notifier to the same environment would be circular.
    # Hence SLACK_WEBHOOK_URL is a REPOSITORY secret; the S022 lesson runs the
    # other way here, and getting it backwards is the silently-green failure mode
    # this repo has already paid for once.
    #
    # A release notifies on success too (unlike a PR): a release build is always
    # worth a line.
    needs: [preflight, integration, build-report, sign-upload]
    if: always()
    continue-on-error: true          # D3: the notifier has no vote on the build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: notify slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NEEDS_JSON: ${{ toJson(needs) }}
          COMMIT_TITLE: ${{ github.event.head_commit.message || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: bash tool/ci/slack_notify.sh
