# appstore-screenshots — render the store screenshots and upload them to the
# App Store listing.
#
# DISPATCH ONLY, and never a step inside release.yml. Uploading writes to the
# founder's public-facing App Store listing; that is not something a tag or a
# merge should be able to do as a side effect — the same rule that keeps
# testflight-testers.yml off `push` because adding a tester emails a real
# person.
#
# The default is `upload: false`: the cheap, safe thing (render + verify + keep
# the artifact) is what you get by not thinking, and the outward-facing half
# takes a deliberate tick.
#
# NO MAC. `flutter test` rasterises widgets on the host and `deliver` with
# `skip_binary_upload` needs no Xcode, so the whole lane runs on ubuntu.
name: appstore-screenshots

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to App Store Connect (outward-facing — it writes to your listing)'
        type: boolean
        default: false
      locales:
        description: 'Which locale folders to send. `tr` needs its version localization to exist first'
        required: true
        default: 'en-US'

concurrency:
  group: appstore-screenshots
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.5"

jobs:
  screenshots:
    name: render + upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # Renders AND verifies every PNG's IHDR — the generator is a widget test
      # and goes green whenever it does not throw, so its exit code says nothing
      # about the pixels. --stage lays them out where deliver looks.
      - name: render screenshots
        run: tool/ci/appstore_screenshots.sh --stage

      # Always produced, upload or not: a dispatch that only renders is a
      # perfectly good way to look at what WOULD be sent before ticking the box.
      - uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots
          path: fastlane/screenshots/
          if-no-files-found: error

      # Drop every locale the dispatch did not ask for. `deliver` uploads what
      # it FINDS on disk, so a locale left in the folder is uploaded whatever
      # the input said — the input has to change the disk, not just the intent.
      - name: keep only the requested locales
        if: ${{ inputs.upload }}
        env:
          LOCALES: ${{ inputs.locales }}
        run: |
          set -euo pipefail
          kept=0
          for dir in fastlane/screenshots/*/; do
            name="$(basename "$dir")"
            if printf '%s' "$LOCALES" | tr ', ' '\n\n' | grep -qx "$name"; then
              echo "keeping $name"
              kept=$((kept + 1))
            else
              echo "dropping $name (not in '$LOCALES')"
              rm -rf "$dir"
            fi
          done
          # Fail closed. An empty screenshots folder makes `deliver` a silent
          # no-op that exits 0, which would read as "uploaded" in the run list.
          if [ "$kept" -eq 0 ]; then
            echo "::error::no locale folder matched '$LOCALES' — nothing to upload"
            exit 1
          fi

      # MIRRORS release.yml's proven block, deliberately, down to the pinned
      # version and the separate `bundle install`. The first draft used
      # `bundler-cache: true` with no `ruby-version` and died on
      # "input ruby-version needs to be specified if no .ruby-version or
      # .tool-versions file exists" — this repo has neither, so the action has
      # nothing to infer from. Copying the block that already works beats
      # re-deriving one, and if a `.ruby-version` ever lands both lanes should
      # change together.
      - uses: ruby/setup-ruby@v1
        if: ${{ inputs.upload }}
        with:
          ruby-version: '3.3'
      - name: bundle install
        if: ${{ inputs.upload }}
        run: bundle install

      - name: fastlane store_screenshots
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: bundle exec fastlane ios store_screenshots

      # REPAIRS what the step above reliably breaks. Measured twice on
      # 2026-08-03: `deliver` uploads the set, verifies it, does not find it
      # (Apple processes screenshots asynchronously) and uploads the WHOLE SET
      # again — six files, ten uploads, because Apple caps a display type at ten
      # and drops the rest. The listing is left with four duplicates and an
      # order nobody chose. `overwrite_screenshots: true` reproduces it exactly
      # rather than avoiding it, so this is not a setting we failed to find.
      #
      # Part of the same run on purpose: a lane that leaves a known-wrong
      # listing behind and relies on someone noticing is worse than no lane.
      - uses: actions/setup-python@v5
        if: ${{ inputs.upload }}
        with:
          python-version: '3.12'
      - name: install deps
        if: ${{ inputs.upload }}
        run: pip install 'pyjwt[crypto]==2.10.1'
      - name: de-duplicate + order the uploaded screenshots
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          LOCALES: ${{ inputs.locales }}
        run: |
          python3 tool/ci/testflight_testers.py \
            --bundle-id com.beyondkaira.hayati \
            --group Friends \
            --dedupe-screenshots "$LOCALES"

      # Never report green without having looked. The dedupe above says what it
      # did; this says what Apple now HOLDS, which is the only claim worth
      # making about an outward-facing write.
      - name: re-read the listing
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          python3 tool/ci/testflight_testers.py \
            --bundle-id com.beyondkaira.hayati \
            --group Friends \
            --store-status
