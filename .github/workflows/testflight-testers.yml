# testflight-testers — create/reuse a TestFlight beta group and add testers.
#
# WHY A WORKFLOW AND NOT A DEV-BOX COMMAND: the App Store Connect API key lives
# only in GitHub secrets (architecture.md §9 — zero credentials in this repo),
# so this is the only place the three ASC_* values resolve. Same credential set
# and same `environment: release` binding as release.yml's sign-upload job:
# ASC_KEY_ID / ASC_ISSUER_ID are `release` ENVIRONMENT secrets while
# ASC_API_KEY_P8_BASE64 is a REPOSITORY secret, and only a job that declares the
# environment sees both (the REL-2 lesson recorded in release.yml).
#
# Manual dispatch ONLY — never on push. Adding an external tester emails a real
# person; that is not something a merge should be able to do as a side effect.
name: testflight-testers

on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Beta group name (created if absent, reused if present)'
        required: true
        default: 'Friends'
      testers:
        description: 'Comma-separated tester emails'
        required: false
        default: ''
      dry_run:
        description: 'Report what would change and touch nothing'
        type: boolean
        default: true
      status_only:
        description: 'Read-only: groups, builds, Beta App Review readiness'
        type: boolean
        default: false
      store_status:
        description: 'Read-only: the APP STORE listing — versions, locales, existing screenshots'
        type: boolean
        default: false
      assign_latest_build:
        description: 'Attach the newest VALID build to the group (a group with no build is inert)'
        type: boolean
        default: false
      # DESTRUCTIVE and outward-facing: it deletes a beta group. A free-text
      # box rather than a boolean on purpose — typing the name is the
      # confirmation, and there is no default that could fire by accident.
      # The tool links, RE-READS to confirm every member landed, and only then
      # deletes; it refuses on an unknown or internal source.
      merge_group:
        description: 'DELETES this group after moving its testers into `group`. Blank = do nothing'
        required: false
        default: ''
      # ADR-038. NOTE what is NOT here: a text box for the contact details.
      # This repository is PUBLIC and workflow_dispatch inputs are recorded in
      # run metadata, so a box asking for the founder's mobile number would
      # publish it permanently. The values come from `release` environment
      # secrets; these two inputs only choose whether to act.
      set_review_contact:
        description: 'Write the Beta App Review contact from the ASC_REVIEW_CONTACT_* secrets'
        type: boolean
        default: false
      submit_for_review:
        description: 'Submit the newest VALID build for Beta App Review (outward-facing — Apple sees it)'
        type: boolean
        default: false

concurrency:
  group: testflight-testers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  manage:
    name: manage testers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # PyJWT signs the ES256 assertion Apple requires; cryptography is its
      # backend for EC keys. Pinned so a future major cannot change the token
      # shape under a lane the founder dispatches by hand.
      - name: install deps
        run: pip install 'pyjwt[crypto]==2.10.1'
      - name: create group + add testers
        # Inputs reach the shell as ENV, never interpolated into the script
        # body: `${{ }}` expansion happens before bash sees the line, so a
        # group name containing shell metacharacters would otherwise execute.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          GROUP_NAME: ${{ inputs.group }}
          TESTER_EMAILS: ${{ inputs.testers }}
          DRY_RUN: ${{ inputs.dry_run }}
          STATUS_ONLY: ${{ inputs.status_only }}
          STORE_STATUS: ${{ inputs.store_status }}
          ASSIGN_BUILD: ${{ inputs.assign_latest_build }}
          MERGE_GROUP: ${{ inputs.merge_group }}
          SET_CONTACT: ${{ inputs.set_review_contact }}
          SUBMIT_REVIEW: ${{ inputs.submit_for_review }}
          # The four founder facts. Absent secrets resolve to empty strings and
          # the tool fails closed naming them, rather than writing three of four.
          ASC_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_FIRST_NAME }}
          ASC_REVIEW_CONTACT_LAST_NAME: ${{ secrets.ASC_REVIEW_CONTACT_LAST_NAME }}
          ASC_REVIEW_CONTACT_EMAIL: ${{ secrets.ASC_REVIEW_CONTACT_EMAIL }}
          ASC_REVIEW_CONTACT_PHONE: ${{ secrets.ASC_REVIEW_CONTACT_PHONE }}
        run: |
          args=(--bundle-id com.beyondkaira.hayati
                --group "$GROUP_NAME"
                --testers "$TESTER_EMAILS")
          # Full ifs rather than `[ x ] && args+=(…)` one-liners: with three of
          # them the short form is a foot-gun waiting for the day one lands as
          # the step's LAST line, where a false test does make `bash -e` exit.
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$STATUS_ONLY" = "true" ]; then args+=(--status); fi
          if [ "$STORE_STATUS" = "true" ]; then args+=(--store-status); fi
          if [ "$ASSIGN_BUILD" = "true" ]; then args+=(--assign-latest-build); fi
          if [ -n "$MERGE_GROUP" ]; then args+=(--merge-group "$MERGE_GROUP"); fi
          if [ "$SET_CONTACT" = "true" ]; then args+=(--set-review-contact); fi
          if [ "$SUBMIT_REVIEW" = "true" ]; then args+=(--submit-for-review); fi
          python3 tool/ci/testflight_testers.py "${args[@]}"
